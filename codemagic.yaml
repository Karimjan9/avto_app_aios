workflows:
  android-checks:
    name: Android checks and debug APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: 3.50.1
      java: 21
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -e
          flutter analyze
          flutter test
      - name: Build Android debug APK
        script: flutter build apk --debug --dart-define-from-file=config/production.json
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  ios-simulator:
    name: iOS simulator and browser preview artifact
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.50.1
      xcode: latest
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -e
          flutter analyze
          flutter test
      - name: Build unsigned iOS simulator application
        script: flutter build ios --simulator --debug --dart-define-from-file=config/production.json
      - name: Archive simulator application
        script: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/iphonesimulator/Runner-simulator.zip
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - build/ios/iphonesimulator/Runner-simulator.zip
